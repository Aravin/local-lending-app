name: local_lending_app
description: White-label local lending app for communities.
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  bloc: ^9.0.0

  # Navigation
  go_router: ^15.1.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.5

  # Auth
  google_sign_in: ^6.2.2

  # HTTP
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # DI
  get_it: ^8.0.3

  # Data / Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dartz: ^0.10.1

  # UI / Charts
  fl_chart: ^0.70.2
  lottie: ^3.1.3
  cached_network_image: ^3.4.1

  # Forms
  reactive_forms: ^17.0.1

  # Localisation / Formatting
  intl: ^0.20.2

  # PDF / Export
  pdf: ^3.11.1
  printing: ^5.13.2

  # Connectivity
  connectivity_plus: ^6.1.1

  # Env
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.9.2

  # Linting
  flutter_lints: ^5.0.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  # Launcher Icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/cape_finance/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F3D3E"
  adaptive_icon_foreground: "assets/images/cape_finance/logo.png"


flutter:
  uses-material-design: true

  assets:
    - assets/images/local_lending_hub/
    - assets/images/cape_finance/
    - assets/icons/
    - .env



  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter/Inter-Bold.ttf
  #         weight: 700
  # TODO: Download Inter font from fonts.google.com, place in assets/fonts/Inter/,
  # then uncomment the fonts section above.

dart_code_metrics:
  metrics:
    cyclomatic-complexity: 10
    maximum-nesting-level: 5
    number-of-parameters: 5
    source-lines-of-code: 50
  metrics-exclude:
    - test/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  rules:
    - avoid-dynamic
    - avoid-returning-widgets
    - no-boolean-literal-compare
    - no-empty-block
    - prefer-trailing-comma
    - prefer-const-border-radius
